name: EditorConfig

on:
  workflow_call:

jobs:
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-24.04
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

          - name: Set up editorconfig-checker
            uses: editorconfig-checker/action-editorconfig-checker@52c9b3667d59817ab9d523c644ee59a70886aec1 # main

      - name: Check editorconfig
        run: editorconfig-checker
