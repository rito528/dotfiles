name: EditorConfig

on:
  workflow_call:

jobs:
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-24.04
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

          - name: Set up editorconfig-checker
            uses: editorconfig-checker/action-editorconfig-checker@9228b032806ba42961a1cc6d71ba738df0456a55 # main

      - name: Check editorconfig
        run: editorconfig-checker
