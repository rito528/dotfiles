name: Markdown Link Check

on:
  workflow_call:

jobs:
  markdown-link-check:
    name: Markdown Link Check
    runs-on: ubuntu-26.04
    steps:
      - parallel:
          - uses: actions/checkout@v7.0.1
          - uses: DeterminateSystems/nix-installer-action@v23

      - name: Check markdown links
        run: |
          set -euo pipefail

          find . -type f -name '*.md' \
            -not -path './.git/*' \
            -print0 \
            | xargs -0 -r nix shell nixpkgs#markdown-link-check --command ./.github/scripts/check-markdown-links.sh
