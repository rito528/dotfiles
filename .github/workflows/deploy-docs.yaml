name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - .github/workflows/deploy-docs.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - parallel:
          - uses: actions/checkout@v7.0.1
          - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build mdBook site
        run: nix shell nixpkgs#mdbook --command mdbook build docs-site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs-site/book

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
