name: EditorConfig

on:
  workflow_call:

jobs:
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-26.04
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

          - name: Set up editorconfig-checker
            uses: editorconfig-checker/action-editorconfig-checker@e53d2fe21373eecafe8f11fc92b7f25d244cc94c # main

      - name: Check editorconfig
        run: editorconfig-checker
