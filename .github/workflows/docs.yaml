name: Docs

on:
  workflow_call:

jobs:
  docs-build:
    name: Docs Build
    runs-on: ubuntu-26.04
    steps:
      - parallel:
          - uses: actions/checkout@v7.0.1
          - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build mdBook site
        run: nix shell nixpkgs#mdbook --command mdbook build docs-site
