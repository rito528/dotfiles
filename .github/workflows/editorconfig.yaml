name: EditorConfig

on:
  workflow_call:

jobs:
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-26.04
    steps:
      - parallel:
          - uses: actions/checkout@v7.0.1

          - name: Set up editorconfig-checker
            uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Check editorconfig
        run: editorconfig-checker
